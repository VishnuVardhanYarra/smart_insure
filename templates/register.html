{% extends 'base.html' %}

{% block title %}Create Account | InsureSmart{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto; padding: 2.5rem; background: rgba(18, 26, 47, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo-icon" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.5rem;">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #fff 0%, var(--primary-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Create InsureSmart Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.4rem;">Save and track your personal AI insurance evaluations</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group" style="margin-bottom: 1.25rem;">
            <label class="form-label"><i class="fa-solid fa-user"></i> Username</label>
            <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
            <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
            <label class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600;">
            <i class="fa-solid fa-user-check"></i> Register Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
